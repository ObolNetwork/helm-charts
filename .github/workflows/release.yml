name: Release Charts

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write

# Runs must not overlap: each one rewrites gh-pages, and a concurrent run can
# clobber index.yaml, silently dropping charts from the published repo.
concurrency:
  group: release-charts
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5
        with:
          version: v3.22.0

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        with:
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Reconcile index with releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin gh-pages
          git worktree add gh-pages origin/gh-pages
          scripts/reconcile-index.sh gh-pages/index.yaml
          cd gh-pages
          if git diff --quiet -- index.yaml; then
            exit 0
          fi
          git add index.yaml
          git commit -m "chore: add missing releases to index.yaml"
          git push origin HEAD:gh-pages

  deploy-metadata:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5
        with:
          version: v3.22.0

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          gpg --batch --pinentry-mode loopback --export-secret-keys > ~/.gnupg/secring.gpg
          gpg --list-secret-keys

      - name: Package and sign charts
        run: |
          mkdir -p .gpg-provenance
          for chart in charts/*/; do
            helm package --sign \
              --key "DV Labs" \
              --keyring ~/.gnupg/secring.gpg \
              "$chart" -d .gpg-provenance
          done

      - name: Attach provenance files to GitHub releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for prov in .gpg-provenance/*.tgz.prov; do
            [ -f "$prov" ] || continue
            tgz_name=$(basename "$prov" .prov)
            chart_tag="${tgz_name%.tgz}"
            # Only upload if the release exists
            if gh release view "$chart_tag" &>/dev/null; then
              gh release upload "$chart_tag" "$prov" --clobber
              echo "Uploaded $prov to release $chart_tag"
            else
              echo "Skipping $prov — release $chart_tag not found"
            fi
          done

      # Publish only the files this job owns. Never stage a gh-pages checkout
      # here: its index.yaml can be stale and would overwrite chart-releaser's.
      - name: Stage provenance and metadata
        run: |
          mkdir -p site
          cp .gpg-provenance/*.tgz.prov site/ 2>/dev/null || true
          cp artifacthub-repo.yml site/ 2>/dev/null || true
          cp pubkey.asc site/ 2>/dev/null || true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          keep_files: true
          enable_jekyll: true
