{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dv-pod.fullname" . }}
  labels:
    {{- include "dv-pod.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "dv-pod.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow Charon P2P traffic from other dv-pod nodes in this Kubernetes cluster (any namespace)
    {{- $udpPort := include "dv-pod.p2pUdpPort" . }}
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "dv-pod.name" . }}
        {{- if or (include "dv-pod.truthy" .Values.p2pService.enabled) .Values.networkPolicy.p2p.allowInbound }}
        # Inbound peers from outside the cluster (p2pService / external address)
        - ipBlock:
            cidr: {{ .Values.networkPolicy.p2p.cidr | default "0.0.0.0/0" }}
            {{- with .Values.networkPolicy.p2p.except }}
            except:
              {{- toYaml . | nindent 14 }}
            {{- end }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.ports.p2pTcp.targetPort }}
        {{- if $udpPort }}
        - protocol: UDP
          port: {{ $udpPort }}
        {{- end }}
    # Allow validator API access from validator clients
    - from:
        {{- if .Values.networkPolicy.validatorClientSelector }}
        - podSelector:
            {{- toYaml .Values.networkPolicy.validatorClientSelector | nindent 12 }}
        {{- end }}
        {{- if .Values.networkPolicy.validatorClientNamespaceSelector }}
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.validatorClientNamespaceSelector | nindent 12 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 3600
    # Allow monitoring access
    {{- if .Values.networkPolicy.monitoring.enabled }}
    - from:
        {{- if .Values.networkPolicy.monitoring.podSelector }}
        - podSelector:
            {{- toYaml .Values.networkPolicy.monitoring.podSelector | nindent 12 }}
        {{- end }}
        {{- if .Values.networkPolicy.monitoring.namespaceSelector }}
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.monitoring.namespaceSelector | nindent 12 }}
        {{- end }}
        {{- /* With no selectors the rule already admits every source; extra peers would only narrow it. */}}
        {{- if or .Values.networkPolicy.monitoring.podSelector .Values.networkPolicy.monitoring.namespaceSelector }}
        {{- with .Values.networkPolicy.monitoring.extraFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 3620
    {{- end }}
    # Allow custom ingress rules
    {{- with .Values.networkPolicy.customIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow access to beacon nodes
    {{- if .Values.networkPolicy.beaconNodes.enabled }}
    - to:
        {{- if .Values.networkPolicy.beaconNodes.podSelector }}
        - podSelector:
            {{- toYaml .Values.networkPolicy.beaconNodes.podSelector | nindent 12 }}
        {{- end }}
        {{- if .Values.networkPolicy.beaconNodes.namespaceSelector }}
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.beaconNodes.namespaceSelector | nindent 12 }}
        {{- end }}
        {{- if .Values.networkPolicy.beaconNodes.ipBlock }}
        - ipBlock:
            {{- toYaml .Values.networkPolicy.beaconNodes.ipBlock | nindent 12 }}
        {{- end }}
      ports:
        - protocol: TCP
          {{- if .Values.networkPolicy.beaconNodes.port }}
          port: {{ .Values.networkPolicy.beaconNodes.port }}
          {{- end }}
    {{- end }}
    # Allow Charon P2P communication with other dv-pod nodes in this Kubernetes cluster
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "dv-pod.name" . }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.ports.p2pTcp.targetPort }}
        {{- if $udpPort }}
        - protocol: UDP
          port: {{ $udpPort }}
        {{- end }}
    {{- if .Values.networkPolicy.p2p.enabled }}
    # Allow Charon P2P to peers and relays outside the cluster (libp2p TCP, and UDP/QUIC)
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.p2p.cidr | default "0.0.0.0/0" }}
            {{- with .Values.networkPolicy.p2p.except }}
            except:
              {{- toYaml . | nindent 14 }}
            {{- end }}
      ports:
        {{- range .Values.networkPolicy.p2p.ports }}
        - protocol: TCP
          port: {{ . }}
        - protocol: UDP
          port: {{ . }}
        {{- end }}
    {{- end }}
    {{- if and (eq (include "dv-pod.statusEnabled" .) "true") .Values.networkPolicy.kubeApi.enabled }}
    # Allow the DKG sidecar to reach the Kubernetes API (status ConfigMap)
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.kubeApi.cidr | default "0.0.0.0/0" }}
      ports:
        {{- range .Values.networkPolicy.kubeApi.ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- end }}
    # Allow access to Obol API for DKG
    {{- if .Values.networkPolicy.obolApi.enabled }}
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.obolApi.cidr | default "0.0.0.0/0" }}
            {{- if .Values.networkPolicy.obolApi.except }}
            except:
              {{- toYaml .Values.networkPolicy.obolApi.except | nindent 14 }}
            {{- end }}
      ports:
        - protocol: TCP
          port: 443
    {{- end }}
    # Allow custom egress rules
    {{- with .Values.networkPolicy.customEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}