{{- if .Values.centralMonitoring.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dv-pod.fullname" . }}-prometheus
  labels:
    {{- include "dv-pod.prometheusLabels" . | nindent 4 }}
spec:
  ports:
  - port: 9090
    protocol: TCP
    targetPort: 9090
  selector:
    {{- include "dv-pod.prometheusSelectorLabels" . | nindent 4 }}
  sessionAffinity: None
  type: ClusterIP
{{- end }}
