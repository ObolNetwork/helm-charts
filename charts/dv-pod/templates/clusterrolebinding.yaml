{{- if and .Values.rbac.enabled .Values.rbac.clusterRules }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-%s" .Release.Namespace (include "dv-pod.serviceAccountName" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "dv-pod.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ printf "%s-%s" .Release.Namespace (include "dv-pod.serviceAccountName" .) | trunc 63 | trimSuffix "-" }}
subjects:
  - kind: ServiceAccount
    name: {{ include "dv-pod.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
