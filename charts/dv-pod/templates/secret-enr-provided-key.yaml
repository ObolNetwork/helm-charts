{{- if and .Values.charon.enr.privateKey (eq (include "dv-pod.shouldCreateEnrJob" .) "true") }}
# Carries charon.enr.privateKey to the ENR job without inlining it in the Job spec.
# Deleted once the pre-install/pre-upgrade hooks succeed; the job copies it into the ENR secret.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dv-pod.enrProvidedKeySecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dv-pod.labels" . | nindent 4 }}
    app.kubernetes.io/component: enr-job
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10" # After the job's RBAC (-15), before the job (-5)
    "helm.sh/hook-delete-policy": "before-hook-creation,hook-succeeded"
type: Opaque
stringData:
  charon-enr-private-key: {{ .Values.charon.enr.privateKey | trimPrefix "0x" | quote }}
{{- end }}
