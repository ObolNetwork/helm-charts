{{- if .Values.centralMonitoring.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dv-pod.fullname" . }}-prometheus
  labels:
    {{- include "dv-pod.prometheusLabels" . | nindent 4 }}
data:
  prometheus.yaml: |
    global:
      scrape_interval: 12s
      evaluation_interval: 12s
    remote_write:
      - url: {{ $.Values.centralMonitoring.promEndpoint }}
        authorization:
          credentials_file: /etc/prometheus/secrets/token
    scrape_configs:
      - job_name: '{{ $.Release.Name }}'
        static_configs:
          - targets: ['{{ include "release.name" . }}:{{ .Values.service.ports.monitoring.port }}']
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dv-pod.fullname" . }}-prometheus
  labels:
    {{- include "dv-pod.prometheusLabels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.centralMonitoring.token | quote }}
{{- end }}
