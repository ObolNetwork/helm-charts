apiVersion: v1
kind: Service
metadata:
  name: {{ include "release.name" . }}
  labels:
    {{- include "dv-pod.labels" . | nindent 4 }}
spec:
  clusterIP: {{ .Values.service.clusterIP }}
  {{- if .Values.service.publishNotReadyAddresses }}
  # charon's readiness probe must not hide the pod from peers or an external validator client.
  publishNotReadyAddresses: true
  {{- end }}
  ports:
    - name: {{ .Values.service.ports.validatorApi.name }}
      protocol: {{ .Values.service.ports.validatorApi.protocol }}
      port: {{ .Values.service.ports.validatorApi.port }}
      targetPort: {{ .Values.service.ports.validatorApi.targetPort }}
    - name: {{ .Values.service.ports.p2pTcp.name }}
      protocol: {{ .Values.service.ports.p2pTcp.protocol }}
      port: {{ .Values.service.ports.p2pTcp.port }}
      targetPort: {{ .Values.service.ports.p2pTcp.targetPort }}
    - name: {{ .Values.service.ports.monitoring.name }}
      protocol: {{ .Values.service.ports.monitoring.protocol }}
      port: {{ .Values.service.ports.monitoring.port }}
      targetPort: {{ .Values.service.ports.monitoring.targetPort }}
    {{- if .Values.validatorClient.enabled }}
    - name: vc-metrics
      protocol: TCP
      port: 5064
      targetPort: 5064
    {{- end }}
  selector:
    {{- include "dv-pod.selectorLabels" . | nindent 4 }}
{{- if ne (include "release.name" .) (include "dv-pod.fullname" .) }}
---
# Governing headless Service for the StatefulSet (spec.serviceName), so each pod gets a
# <pod>.<fullname>.<namespace>.svc DNS record. Only needed when the Service above has a
# different name; the StatefulSet's serviceName is immutable, so it can't simply be renamed.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dv-pod.fullname" . }}
  labels:
    {{- include "dv-pod.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: {{ .Values.service.ports.p2pTcp.name }}
      protocol: {{ .Values.service.ports.p2pTcp.protocol }}
      port: {{ .Values.service.ports.p2pTcp.port }}
      targetPort: {{ .Values.service.ports.p2pTcp.targetPort }}
  selector:
    {{- include "dv-pod.selectorLabels" . | nindent 4 }}
{{- end }}
