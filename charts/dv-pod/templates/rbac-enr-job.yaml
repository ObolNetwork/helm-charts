{{- if eq (include "dv-pod.shouldCreateEnrJob" .) "true" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dv-pod.fullname" . }}-enr-job
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dv-pod.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-weight": "-15" # Ensure SA is created before the job that uses it
    "helm.sh/hook-delete-policy": "before-hook-creation,hook-succeeded"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "dv-pod.fullname" . }}-enr-job-role
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dv-pod.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-weight": "-15"
    "helm.sh/hook-delete-policy": "before-hook-creation,hook-succeeded"
rules:
# Scoped to the ENR secret(s) only, so the job can't read other secrets (e.g. validator keystores) in the namespace.
# The legacy shared name is included so an existing identity can be migrated instead of regenerated.
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames:
    - {{ include "dv-pod.enrSecretName" . | quote }}
  verbs: ["get", "update", "patch"]
{{- $legacy := .Values.secrets.defaultEnrPrivateKey }}
{{- if and $legacy (not .Values.charon.enr.existingSecret.name) (ne $legacy (include "dv-pod.enrSecretName" .)) }}
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames:
    - {{ $legacy | quote }}
  verbs: ["get"]
{{- end }}
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create"]  # create can't be restricted by resourceNames
# Public ENR ConfigMap
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames:
    - {{ include "dv-pod.enrConfigMapName" . | quote }}
  verbs: ["get", "update", "patch"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["create"]
# Read-only: which StatefulSet already uses the legacy ENR secret (never share an identity between releases)
- apiGroups: ["apps"]
  resources: ["statefulsets"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "dv-pod.fullname" . }}-enr-job-rolebinding
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dv-pod.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-weight": "-15"
    "helm.sh/hook-delete-policy": "before-hook-creation,hook-succeeded"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "dv-pod.fullname" . }}-enr-job-role
subjects:
- kind: ServiceAccount
  name: {{ include "dv-pod.fullname" . }}-enr-job
  namespace: {{ .Release.Namespace }}
{{- end }}
