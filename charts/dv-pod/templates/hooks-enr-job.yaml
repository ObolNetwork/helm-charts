{{- if eq (include "dv-pod.shouldCreateEnrJob" .) "true" -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "dv-pod.fullname" . }}-enr-job
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dv-pod.labels" . | nindent 4 }}
    app.kubernetes.io/component: enr-job
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5" # After RBAC, before main statefulset
    "helm.sh/hook-delete-policy": "before-hook-creation,hook-succeeded"
{{- if .Values.charon.enr.generate.annotations }}
    {{- toYaml .Values.charon.enr.generate.annotations | nindent 4 }}
{{- end }}
spec:
  template:
    metadata:
      name: {{ include "dv-pod.fullname" . }}-enr-job-pod
      labels:
        {{- include "dv-pod.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: enr-job-pod
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "dv-pod.fullname" . }}-enr-job # Service account with permission to access k8s secrets
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      volumes:
        - name: enr-data
          emptyDir: {}
      initContainers:
        - name: check-existing-secret
          image: "{{ .Values.charon.enr.generate.kubectlImage.repository }}:{{ .Values.charon.enr.generate.kubectlImage.tag }}"
          imagePullPolicy: {{ .Values.charon.enr.generate.kubectlImage.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              NAMESPACE="{{ .Release.Namespace }}"
              # The Secret this release mounts as its charon identity (see dv-pod.enrSecretName).
              SECRET_NAME="{{ include "dv-pod.enrSecretName" . }}"
              ENR_PRIVATE_KEY_DATA_NAME="{{ include "dv-pod.enrSecretDataKey" . }}"
              ENR_PUBLIC_ADDRESS_DATA_NAME="{{ include "dv-pod.enrSecretPublicDataKey" . }}"
              # Pre-0.22 shared default name, checked when SECRET_NAME does not exist yet so an existing
              # identity is migrated rather than replaced. Empty when an explicit secret is configured.
              LEGACY_SECRET_NAME="{{ if not .Values.charon.enr.existingSecret.name }}{{ .Values.secrets.defaultEnrPrivateKey }}{{ end }}"
              STATEFULSET_NAME="{{ include "dv-pod.fullname" . }}"

              # 0 if the secret exists, 1 if it does not; aborts on any other error (RBAC, API down), so an
              # unreadable identity is never mistaken for a missing one and replaced.
              secret_exists() {
                if OUT=$(kubectl get secret "$1" -n "${NAMESPACE}" -o name 2>&1); then
                  return 0
                fi
                case "$OUT" in
                  *NotFound*|*"not found"*) return 1 ;;
                esac
                echo "ERROR: cannot check secret '$1': $OUT"
                exit 1
              }
              # Reads one base64 data field of a secret ("" when absent).
              secret_field() {
                kubectl get secret "$1" -n "${NAMESPACE}" -o jsonpath="{.data.$2}" 2>/dev/null || true
              }
              # Secret mounted as the ENR volume by a StatefulSet's pod template.
              sts_enr_secret() {
                kubectl get statefulset "$1" -n "${NAMESPACE}" \
                  -o jsonpath='{.spec.template.spec.volumes[?(@.name=="charon-enr-private-key")].secret.secretName}' 2>/dev/null || true
              }

              echo "Checking if secret '$SECRET_NAME' already exists in namespace '$NAMESPACE'..."
              if secret_exists "${SECRET_NAME}"; then
                echo "INFO: Secret '$SECRET_NAME' already exists. Checking field completeness..."
                PRIVATE_KEY_DATA=$(secret_field "${SECRET_NAME}" "${ENR_PRIVATE_KEY_DATA_NAME}")
                PUBLIC_ENR_DATA=$(secret_field "${SECRET_NAME}" "${ENR_PUBLIC_ADDRESS_DATA_NAME}")

                if [ -n "$PRIVATE_KEY_DATA" ] && [ -n "$PUBLIC_ENR_DATA" ]; then
                  echo "INFO: Both private key and public ENR are present. Skipping ENR generation."
                  echo "$PUBLIC_ENR_DATA" | base64 -d > /enr-shared/existing-enr
                  touch /enr-shared/skip-generation
                elif [ -n "$PRIVATE_KEY_DATA" ]; then
                  echo "INFO: Private key exists but public ENR is missing. Will derive the public ENR from the existing private key."
                  echo "$PRIVATE_KEY_DATA" | base64 -d > /enr-shared/existing-private-key
                  touch /enr-shared/generate-enr-only
                else
                  echo "ERROR: Secret '$SECRET_NAME' exists but has no '${ENR_PRIVATE_KEY_DATA_NAME}' field."
                  echo "ERROR: Refusing to overwrite it. Add the private key to it, or delete it to generate a new identity."
                  exit 1
                fi
                exit 0
              fi

              echo "Secret '$SECRET_NAME' does not exist."
              if [ -n "$LEGACY_SECRET_NAME" ] && [ "$LEGACY_SECRET_NAME" != "$SECRET_NAME" ] \
                && secret_exists "${LEGACY_SECRET_NAME}"; then
                echo "INFO: Found legacy ENR secret '$LEGACY_SECRET_NAME'. Checking whether it belongs to this release..."
                OWN=$(sts_enr_secret "${STATEFULSET_NAME}")
                ADOPT=""
                if [ "$OWN" = "$LEGACY_SECRET_NAME" ]; then
                  echo "INFO: StatefulSet '$STATEFULSET_NAME' already uses '$LEGACY_SECRET_NAME': keeping this identity."
                  ADOPT=true
                else
                  CLAIMED=""
                  ALL_STS=$(kubectl get statefulset -n "${NAMESPACE}" -o jsonpath='{.items[*].metadata.name}') \
                    || { echo "ERROR: cannot list StatefulSets to check who uses '$LEGACY_SECRET_NAME'"; exit 1; }
                  for sts in $ALL_STS; do
                    [ "$sts" = "$STATEFULSET_NAME" ] && continue
                    if [ "$(sts_enr_secret "$sts")" = "$LEGACY_SECRET_NAME" ]; then
                      CLAIMED="$sts"
                    fi
                  done
                  if [ -n "$CLAIMED" ]; then
                    echo "INFO: '$LEGACY_SECRET_NAME' is the identity of StatefulSet '$CLAIMED'; not sharing it. A new identity will be created."
                  else
                    echo "INFO: '$LEGACY_SECRET_NAME' is not used by any other StatefulSet: adopting it as this release's identity."
                    ADOPT=true
                  fi
                fi
                if [ -n "$ADOPT" ]; then
                  PRIVATE_KEY_DATA=$(secret_field "${LEGACY_SECRET_NAME}" "${ENR_PRIVATE_KEY_DATA_NAME}")
                  PUBLIC_ENR_DATA=$(secret_field "${LEGACY_SECRET_NAME}" "${ENR_PUBLIC_ADDRESS_DATA_NAME}")
                  if [ -z "$PRIVATE_KEY_DATA" ]; then
                    echo "ERROR: Legacy secret '$LEGACY_SECRET_NAME' has no '${ENR_PRIVATE_KEY_DATA_NAME}' field; refusing to guess an identity."
                    exit 1
                  fi
                  echo "$PRIVATE_KEY_DATA" | base64 -d > /enr-shared/existing-private-key
                  touch /enr-shared/copy-existing
                  echo "INFO: Will copy the identity from '$LEGACY_SECRET_NAME' into '$SECRET_NAME'."
                  exit 0
                fi
              fi
              echo "INFO: ENR generation will proceed."
          volumeMounts:
            - name: enr-data
              mountPath: /enr-shared
      containers:
        - name: charon-key-generator
          image: {{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              # Check if we should skip generation entirely
              if [ -f /enr-shared/skip-generation ]; then
                echo "INFO: Skipping ENR generation as secret already contains both fields."
                exit 0
              fi

              mkdir -p /enr-output

              # Derive the public ENR from an existing private key (incomplete secret, or a migrated legacy identity)
              if [ -f /enr-shared/generate-enr-only ] || [ -f /enr-shared/copy-existing ]; then
                echo "INFO: Deriving public ENR from the existing private key."
                # Copy the existing private key to the expected location
                cp /enr-shared/existing-private-key /enr-output/charon-enr-private-key
                chmod 600 /enr-output/charon-enr-private-key
                echo "INFO: Deriving public ENR from existing private key using 'charon enr --data-dir /enr-output' ..."
                # 'charon enr --data-dir' will read the key from /enr-output/charon-enr-private-key
                PUBLIC_ENR_STRING=$(charon enr --data-dir /enr-output)
              elif [ -n "${PROVIDED_ENR_PRIVATE_KEY:-}" ]; then
                echo "INFO: Using provided ENR private key from values."
                # Write to the default location within data-dir (0x prefix already stripped)
                printf '%s\n' "${PROVIDED_ENR_PRIVATE_KEY}" > /enr-output/charon-enr-private-key
                chmod 600 /enr-output/charon-enr-private-key
                echo "INFO: Deriving public ENR from provided private key using 'charon enr --data-dir /enr-output' ..."
                # 'charon enr --data-dir' will read the key from /enr-output/charon-enr-private-key
                PUBLIC_ENR_STRING=$(charon enr --data-dir /enr-output)
              else
                echo "INFO: No private key provided, generating new ENR private key and public ENR using 'charon create enr --data-dir /enr-output' ..."
                # 'charon create enr --data-dir' will generate the private key file in /enr-output
                # and output the public ENR string to stdout.
                PUBLIC_ENR_STRING=$(charon create enr --data-dir /enr-output)
                # Ensure the generated private key is readable only by the owner
                if [ -f "/enr-output/charon-enr-private-key" ]; then
                  echo "INFO: Setting secure permissions on generated /enr-output/charon-enr-private-key"
                  chmod 600 /enr-output/charon-enr-private-key
                else
                  echo "ERROR: Expected private key /enr-output/charon-enr-private-key not found after generation."
                  exit 1 # or handle error appropriately
                fi
              fi

              echo "INFO: Public ENR String: ${PUBLIC_ENR_STRING}"
              # The PUBLIC_ENR_STRING might contain log lines from charon, extract just the ENR string.
              # A common pattern is that the ENR string itself is on the last line or is prefixed.
              # Assuming ENR is the last non-empty line of output, or adjust if charon's output is different.
              # A simple way: filter for 'enr:' prefix.
              CLEAN_PUBLIC_ENR_STRING=$(echo "${PUBLIC_ENR_STRING}" | grep '^enr:' | tail -n 1)
              if [ -z "${CLEAN_PUBLIC_ENR_STRING}" ]; then
                echo "ERROR: Could not extract clean ENR string from output: ${PUBLIC_ENR_STRING}"
                exit 1
              fi
              echo "${CLEAN_PUBLIC_ENR_STRING}" > /enr-output/enr

              # Ensure the private key file is present and not empty
              if [ ! -s "/enr-output/charon-enr-private-key" ]; then
                echo "ERROR: charon-enr-private-key not found or empty in /enr-output."
                ls -l /enr-output # For debugging
                exit 1
              fi
              echo "INFO: ENR private key and public string prepared in /enr-output."
          {{- if .Values.charon.enr.privateKey }}
          env:
            - name: PROVIDED_ENR_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "dv-pod.enrProvidedKeySecretName" . }}
                  key: charon-enr-private-key
          {{- end }}
          volumeMounts:
            - name: enr-data
              mountPath: /enr-output
            - name: enr-data
              mountPath: /enr-shared
        - name: kubectl-secret-creator
          image: "{{ .Values.charon.enr.generate.kubectlImage.repository }}:{{ .Values.charon.enr.generate.kubectlImage.tag }}"
          imagePullPolicy: {{ .Values.charon.enr.generate.kubectlImage.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              SECRET_NAME="{{ include "dv-pod.enrSecretName" . }}"
              NAMESPACE="{{ .Release.Namespace }}"
              ENR_PUBLIC_ADDRESS_DATA_NAME="{{ include "dv-pod.enrSecretPublicDataKey" . }}"

              ENR_CONFIGMAP_NAME="{{ include "dv-pod.enrConfigMapName" . }}"

              # Publishes the public ENR in a ConfigMap so agents/humans can read it without Secret access.
              write_enr_configmap() {
                echo "Writing public ENR to ConfigMap '$ENR_CONFIGMAP_NAME'..."
                kubectl create configmap "${ENR_CONFIGMAP_NAME}" \
                  --namespace="${NAMESPACE}" \
                  --from-literal=enr="$1" \
                  --from-literal=secretName="${SECRET_NAME}" \
                  --dry-run=client -o yaml | kubectl apply -f -
                kubectl label configmap "${ENR_CONFIGMAP_NAME}" -n "${NAMESPACE}" --overwrite \
                  app.kubernetes.io/name={{ include "dv-pod.name" . }} \
                  app.kubernetes.io/instance={{ .Release.Name }} \
                  app.kubernetes.io/component=enr
              }

              if [ -f /enr-shared/skip-generation ]; then
                echo "INFO: Secret already contains both fields; not modifying it."
                write_enr_configmap "$(cat /enr-shared/existing-enr)"
                exit 0
              fi

              echo "Waiting for ENR key files in /enr-input..."
              # Wait for the private key file and the public ENR string file
              while [ ! -f /enr-input/charon-enr-private-key ] || [ ! -f /enr-input/enr ]; do
                echo "Waiting for /enr-input/charon-enr-private-key and /enr-input/enr..."
                ls -l /enr-input # For debugging
                sleep 2
              done
              echo "ENR key files found."

              PRIVATE_KEY=$(cat /enr-input/charon-enr-private-key)
              PUBLIC_ENR=$(cat /enr-input/enr)

              if [ -z "$PRIVATE_KEY" ] || [ -z "$PUBLIC_ENR" ]; then
                echo "ERROR: Private key or public ENR is empty."
                echo "Private Key Content: $(cat /enr-input/charon-enr-private-key | wc -c) characters"
                echo "Public ENR Content: $(cat /enr-input/enr)"
                exit 1
              fi

              # Check if we're only adding the missing ENR field to an existing secret
              if [ -f /enr-shared/generate-enr-only ]; then
                echo "INFO: Adding missing public ENR field to existing secret '$SECRET_NAME'..."
                # Use kubectl patch to add only the missing field
                kubectl patch secret "${SECRET_NAME}" -n "${NAMESPACE}" --type='merge' -p="{\"data\":{\"${ENR_PUBLIC_ADDRESS_DATA_NAME}\":\"$(echo -n "$PUBLIC_ENR" | base64 -w 0)\"}}"
                echo "Secret '$SECRET_NAME' updated with missing ENR field successfully."
              else
                # Never overwrite an identity created in the meantime (race protection).
                if kubectl get secret "${SECRET_NAME}" -n "${NAMESPACE}" >/dev/null 2>&1; then
                  echo "INFO: Secret '$SECRET_NAME' appeared meanwhile. Not overwriting it."
                  EXISTING=$(kubectl get secret "${SECRET_NAME}" -n "${NAMESPACE}" -o jsonpath="{.data.${ENR_PUBLIC_ADDRESS_DATA_NAME}}" | base64 -d)
                  [ -n "$EXISTING" ] && write_enr_configmap "$EXISTING"
                  exit 0
                fi

                echo "Creating secret '$SECRET_NAME'..."
                kubectl create secret generic "${SECRET_NAME}" \
                  --namespace="${NAMESPACE}" \
                  --from-literal="{{ include "dv-pod.enrSecretDataKey" . }}=${PRIVATE_KEY}" \
                  --from-literal="${ENR_PUBLIC_ADDRESS_DATA_NAME}=${PUBLIC_ENR}"
                echo "Secret '$SECRET_NAME' created successfully."
              fi
              write_enr_configmap "${PUBLIC_ENR}"
          env:
            - name: GODEBUG
              value: "x509sha1=1,tls13=0"
          volumeMounts:
            - name: enr-data
              mountPath: /enr-input
            - name: enr-data  
              mountPath: /enr-shared
      {{- with .Values.charon.enr.generate.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  ttlSecondsAfterFinished: 300
  backoffLimit: 3 # Number of retries before considering the job failed
{{- end }}
