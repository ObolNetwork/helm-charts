{{- if .Values.centralMonitoring.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dv-pod.fullname" . }}-prometheus
  labels:
    {{- include "dv-pod.prometheusLabels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "dv-pod.prometheusSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/prometheus-configmap.yaml") . | sha256sum }}
      labels:
        {{- include "dv-pod.prometheusSelectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
      - args:
        - --config.file=/etc/prometheus/prometheus.yaml
        image: prom/prometheus:v3.11.1
        name: prometheus
        ports:
        - containerPort: 9090
          protocol: TCP
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - mountPath: /etc/prometheus/prometheus.yaml
          name: config
          subPath: prometheus.yaml
        - mountPath: /etc/prometheus/secrets
          name: token
          readOnly: true
        - mountPath: /prometheus
          name: data
      volumes:
      - name: config
        configMap:
          name: {{ include "dv-pod.fullname" . }}-prometheus
      - name: token
        secret:
          secretName: {{ include "dv-pod.fullname" . }}-prometheus
      - name: data
        emptyDir: {}
{{- end }}
