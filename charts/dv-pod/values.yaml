# Default values for dv-pod.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# -- Network name for the Ethereum network
# Supported values: mainnet, sepolia, hoodi
# The chainId is automatically derived from the network name
network: mainnet  # Default to Mainnet

# -- How this node joins its distributed validator cluster:
# - `auto` (default): infer from the values set, as charts < 0.22 did:
#   `configMaps.clusterLock` -> lock, `charon.lockHash` -> lockHash, any `dkg.definition.*` -> definition,
#   otherwise launchpad.
# - `launchpad`: Launchpad invite. The DKG sidecar polls the Obol API for a definition containing this
#   node's ENR under `charon.operatorAddress` (required), waits for every operator to sign, then runs the DKG.
# - `definition`: direct route. The cluster definition (from `charon create dkg`) is given by exactly one of
#   `dkg.definition.configHash`, `.url` or `.configMap`. No operator address needed; this node's ENR must be
#   one of the definition's operators.
# - `lock`: import an existing cluster; `configMaps.clusterLock` is required. No DKG.
# - `lockHash`: like `lock` for large locks; `charon.lockHash` is required and the lock is fetched from the Obol API.
mode: auto

# -- Kubernetes secrets names.
# The ENR private key (this node's charon identity) lives in, in order of precedence:
# 1. `charon.enr.existingSecret.name`, if set;
# 2. on upgrade, the Secret this release's StatefulSet already mounts (an identity is never replaced);
# 3. `secrets.defaultEnrPrivateKey` ("charon-enr-private-key") if it exists in the namespace and no other
#    StatefulSet uses it (a pre-created Secret for importing a cluster, or an install from chart < 0.22);
# 4. otherwise a per-release Secret "<fullname>-enr-key" (e.g. "my-dv-pod-enr-key"), created by the ENR job.
# Two releases in one namespace therefore never share an identity. The public ENR is also published to the
# ConfigMap "<fullname>-enr" (key `enr`), so it can be read without access to Secrets.
secrets:
  # -- Legacy shared ENR secret name, adopted if it exists and is not used by another release.
  # IMPORTANT: only the release namespace is checked. Set to "" to never adopt it.
  defaultEnrPrivateKey: "charon-enr-private-key"

# -- Kubernetes configMaps names for non-sensitive configuration data.
configMaps:
  # -- Name of the ConfigMap containing the cluster-lock.json file (`mode: lock`).
  # Set this to the name of an existing ConfigMap to skip the DKG process.
  # Example: kubectl create configmap cluster-lock --from-file=.charon/cluster-lock.json
  # Then set: clusterLock: "cluster-lock"
  # If not set or if the ConfigMap doesn't exist, the DKG process will run.
  # NOTE: For large cluster-lock files (>1MB), use charon.lockHash instead
  # clusterLock: "cluster-lock"
  clusterLock: ""

# This code block control's charon's configuration, including the DKG initcontainer
charon:
  # -- The Ethereum address of this operator (the wallet that signs the Launchpad invite).
  # Required in `mode: launchpad` (and `mode: auto` without a lock or definition); not needed for `definition`, `lock` or `lockHash`.
  operatorAddress: ""

  # -- The nickname this Charon appears as in monitoring and its peer's logs. Maximum 32 characters.
  nickname: ""

  # -- Beacon node endpoints (your own synced consensus client's beacon API). Empty means the Obol Stack's
  # node for `network`: http://ethereum-beacon.ethereum-<network>.svc.cluster.local:5052, which is what
  # `obol network install ethereum --network <network>` creates (its first deployment's id is the network
  # name). Set this outside the Stack, or for a Stack deployment with another id (`obol network list`).
  # All beacon nodes specified here will be called for every charon request, if you want to leverage fallback behaviour
  # place secondary beacon nodes in charon.fallbackBeaconNodeEndpoints[]
  beaconNodeEndpoints: []

  # -- Fallback beacon node endpoints (optional)
  # These will be used if the primary beaconNodeEndpoints are unavailable.
  # If empty and publicnodeFallback is true, the publicnode.com beacon API for `network` is used.
  fallbackBeaconNodeEndpoints: []
  # Example:
  # - "http://backup-beacon-2:5052"

  # -- When fallbackBeaconNodeEndpoints is empty, fall back to the public publicnode.com beacon API matching `network`.
  # Set to false to run with no fallback beacon node.
  publicnodeFallback: true

  # -- Beacon node authentication headers
  # WARNING: These headers will be sent to ALL beacon nodes, which could leak credentials
  # Format: "Authorization=Basic <base64_encoded_credentials>"
  # To generate: echo -n "username:password" | base64
  # Example: "Authorization=Basic am9objpkb2U="
  beaconNodeHeaders: ""

  # -- Optional: Name of the secret containing beacon node headers
  # Use this for secure credential storage instead of beaconNodeHeaders
  # The secret should contain a key specified by charon.beaconNodeHeadersSecretKey
  beaconNodeHeadersSecretName: ""

  # -- Optional: Key within the charon.beaconNodeHeaders secret to read from
  beaconNodeHeadersSecretKey: "headers"

  # -- Optional: Execution client RPC endpoint URL (e.g., your Ethereum execution client)
  # Note: Charon currently only supports a single execution endpoint
  # This is only needed if an operator in the cluster uses a smart contract wallet for an operator signature.
  # If that does not apply to this cluster, this field can be left unset.
  executionClientRpcEndpoint: ""

  # --- Charon command line options ---
  ## ref: https://docs.obol.tech/docs/learn/charon/charon-cli-reference

  # -- Enables the builder api (MEV) for validator proposals.
  # The Builder API must also be enabled on your beacon node client(s).
  # The Beacon node must either be connected to a mev sidecar or a mev relay to access the builder network.
  # More documentation about MEV can be found [here](https://docs.obol.org/advanced-and-troubleshooting/advanced/enable-mev).
  # Accepts a boolean; the strings "true"/"false" from older values files are still understood.
  builderApi: true

  # -- Minimum feature set to enable by default: alpha, beta, or stable. Warning: modify at own risk. (default "stable")
  featureSet: "stable"

  # -- Comma-separated list of features to disable, overriding the default minimum feature set.
  featureSetDisable: ""

  # -- Comma-separated list of features to enable, overriding the default minimum feature set.
  featureSetEnable: ""

  # -- Enables polling the Obol API for signed fee recipient update messages that override the currently configured fee recipient.
  fetchFeeRecipientUpdates: true

  # -- The path on the pod to the cluster lock file that definesthe distributed validator cluster. (default "/charon-data/cluster-lock.json")
  lockFile: "/charon-data/cluster-lock.json"

  # -- Cluster lock hash for large cluster-lock files (>1MB); used by `mode: lockHash`.
  # The DKG sidecar fetches the full cluster-lock from the Obol API using this hash
  # Extract the hash from a cluster-lock.json using: `jq -r '.lock_hash' cluster-lock.json`
  # Alternative to providing the full cluster-lock.json file via the configMaps.clusterLock value
  lockHash: ""

  # -- Log format; console, logfmt or json (default "json")
  logFormat: "json"

  # -- Log level; debug, info, warn or error (default "info")
  logLevel: "info"

  # --  Enables sending of logfmt structured logs to these Loki log aggregation server addresses. This is in addition to normal stderr logs.
  lokiAddresses: ""

  # -- Service label sent with logs to Loki.
  lokiService: ""

  # -- Listening address (ip and port) for the monitoring API (prometheus, pprof). (default "127.0.0.1:3620")
  monitoringAddress: "0.0.0.0:3620"

  # -- Disables cluster definition and lock file verification.
  noVerify: false

  # -- Comma-separated list of CIDR subnets for allowing only certain peer connections. Example: 192.168.0.0/16 would permit connections to peers on your local network only. The default is to accept all connections.
  p2pAllowlist: ""

  # -- Comma-separated list of CIDR subnets for disallowing certain peer connections. Example: 192.168.0.0/16 would disallow connections to peers on your local network. The default is to accept all connections.
  p2pDenylist: ""

  # -- Disables TCP port reuse for outgoing libp2p connections.
  p2pDisableReuseport: ""

  # --  The DNS hostname advertised by libp2p. This may be used to advertise an external DNS.
  p2pExternalHostname: ""

  # -- The IP address advertised by libp2p. This may be used to advertise an external IP.
  p2pExternalIp: ""

  # -- Comma-separated list of libp2p relay URLs or multiaddrs.
  # Default list is provided by libp2p and may change over time
  p2pRelays: ""

  # -- Comma-separated list of listening TCP addresses (ip and port) for libP2P traffic. Empty default doesn't bind to local port therefore only supports outgoing connections.
  p2pTcpAddress: "0.0.0.0:3610"

  # -- Comma-separated list of listening UDP addresses (ip and port) for libp2p QUIC traffic, e.g. "0.0.0.0:3610".
  # Empty (default) disables UDP. QUIC is an alpha feature in charon v1.11: also set `featureSetEnable: quic`.
  # Adds a `p2p-udp` container port (and a UDP port on `p2pService`) on the parsed port.
  p2pUdpAddress: ""

  # -- Listening address (ip and port) for validator-facing traffic proxying the beacon-node API. (default "127.0.0.1:3600")
  validatorApiAddress: "0.0.0.0:3600"

  # -- If enabled, it will set p2pExternalHostname value to the pod name and enable direct connection between cluster nodes.
  # This is useful for deployments where pods can directly communicate with each other.
  # Accepts a boolean; the strings "true"/"false" from older values files are still understood.
  directConnectionEnabled: true

  # -- Path within the Charon container where the ENR private key file will be mounted.
  privateKeyFile: "/data/charon-enr-private-key"

  # -- DKG sidecar init container (obolnetwork/charon-dkg-sidecar). It prepares participation according to `mode`:
  # exits at once if /charon-data/cluster-lock.json exists (or is mounted from `configMaps.clusterLock`), fetches the
  # lock for `charon.lockHash`, or obtains a fully signed cluster definition (Launchpad polling by operator address,
  # or `dkg.definition`). With `dkg.runner: charon` the DKG itself then runs in the `charon-dkg` init container.
  # It also writes progress to the "<fullname>-dkg-status" ConfigMap (`dkg.status.enabled`).
  # Disable it only to bring your own cluster-lock and key shares (`mode: lock`).
  dkgSidecar:
    enabled: true
    image:
      # -- Image repository for the DKG sidecar
      repository: "obolnetwork/charon-dkg-sidecar"
      # -- DKG sidecar image tag. 193391e is v1.1.0 (DKG_RUNNER/DEFINITION_SOURCE/status
      # reporting) plus charon v1.11.2 and node 22.23.4 (eMudhra CA fix), pinned by digest.
      tag: "193391e@sha256:6dcb9af3701e58c1902401f9f6562bd64e412e12d32d9448944f42275fc82e59"
      pullPolicy: "IfNotPresent"
    # -- Initial delay in seconds before the first retry of a polling cycle.
    initialRetryDelaySeconds: 10
    # -- Maximum delay in seconds for exponential backoff between polling cycles.
    maxRetryDelaySeconds: 300
    # -- Factor by which the retry delay increases after each polling cycle (e.g., 2 for doubling).
    retryDelayFactor: 2
    # -- Delay in seconds between polling retries
    retryDelaySeconds: 10
    # -- Page limit for API calls when fetching cluster definitions
    pageLimit: 10
    # -- API endpoint for the Obol network to fetch cluster definitions
    apiEndpoint: "https://api.obol.tech"
    # -- Launchpad mode only: join just this cluster definition (optional).
    # Must be a valid 32-byte hex hash with 0x prefix (66 characters total).
    # Example: "0x7f0fd29abb11674b4e61000de26bff3600237aab0402427bd1409756665c2115"
    targetConfigHash: ""
    # -- Resources for the cluster poller init container
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
    # -- Service account settings for test pods
    serviceAccount:
      create: true # Whether to specify the test service account for test pods

  enrJob:
    # -- Enable or disable the Kubernetes Job that generates/manages the ENR.
    # Note: This is typically not needed as the job automatically detects existing secrets.
    # The job will check if the ENR secret already exists and skip generation if found.
    # Only set to false for advanced use cases where you need to completely disable the job.
    enabled: true

  # --- Configuration for ENR management ---
  enr:
    # -- Provide the ENR private key directly (hex format, e.g., 0x...).
    # The ENR job uses it to create the ENR secret (passed via a short-lived hook Secret, not the Job spec).
    # Ignored if the ENR secret already exists, so an existing identity is never overwritten.
    # Prefer 'existingSecret': values are stored in the Helm release.
    privateKey: ""

    # -- Point to an existing Kubernetes secret that holds the ENR private key.
    # The ENR job never overwrites it; it only adds a missing public `enr` field.
    # NOTE: If not set, see `secrets` above for how the secret name is chosen.
    existingSecret:
      name: ""           # Name of the K8s secret (e.g., "my-dv-pod-enr-secret")
      # -- Key in the secret's 'data' field holding the private key hex string
      privateKeyDataKey: "charon-enr-private-key"
      # -- Key in the secret's 'data' field holding the public ENR string
      publicKeyDataKey: "enr"

    # -- Enable automatic generation of an ENR private key.
    # Only used if 'privateKey' and 'existingSecret.name' are not provided.
    # The generated key will be stored in a secret with data keys 'charon-enr-private-key' and 'enr'.
    generate:
      enabled: true
      # -- Annotations to add to the ENR generation job
      annotations: {}
      # -- Node selector for the ENR generation job
      # The job generates the key with the main charon image (`image`).
      nodeSelector: {}
      # -- Image to use for kubectl operations within the ENR generation job
      # This image must contain a compatible kubectl binary and a POSIX shell.
      # bitnamisecure only publishes `latest`, so it is pinned by digest.
      kubectlImage:
        repository: "bitnamisecure/kubectl"
        tag: "latest@sha256:999d5eb28f404b45f15117f2a110ff23c6164f76edac261d75d783b6e88252b7"
        pullPolicy: "IfNotPresent"


# -- DKG (distributed key generation) settings. See `mode` for how the cluster definition is found.
dkg:
  # -- Who runs `charon dkg`:
  # - `charon` (default): the sidecar only fetches/validates the definition and exits; a `charon-dkg` init
  #   container then runs `charon dkg` with this chart's charon `image`, so the DKG always uses the same
  #   charon version as the node. A `dkg-report` init container records the result.
  # - `sidecar`: legacy; the sidecar runs the charon binary bundled in its own image.
  runner: charon
  # -- Cluster definition for `mode: definition` (or `mode: auto`). Set exactly one source.
  definition:
    # -- Config hash of a definition published to the Obol API (`charon create dkg --publish`), 0x + 64 hex.
    configHash: ""
    # -- HTTPS URL serving the cluster-definition.json.
    url: ""
    # -- Name of a ConfigMap in the release namespace holding the cluster-definition.json.
    # Example: kubectl create configmap cluster-definition --from-file=cluster-definition.json
    configMap: ""
    # -- Key within `dkg.definition.configMap` holding the definition.
    configMapKey: "cluster-definition.json"
  # -- Publish the resulting cluster-lock to the Obol API (`charon dkg --publish`, to `charon.dkgSidecar.apiEndpoint`). Runner `charon` only.
  publish: true
  # -- Timeout for one `charon dkg` attempt, e.g. "5m" (empty: charon default, 2m). Runner `charon` only.
  timeout: ""
  # -- Seconds to wait between `charon dkg` attempts while peers come online. Runner `charon` only.
  retryDelaySeconds: 10
  # -- Extra arguments for `charon dkg`. Runner `charon` only.
  extraArgs: []
  # -- Resources for the `charon-dkg` init container.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  status:
    # -- Have the sidecar publish DKG progress to the ConfigMap "<fullname>-dkg-status"
    # (keys: phase, message, updatedAt, enr, operatorAddress, definitionSource, configHash, clusterName,
    # signatures, lockHash, numValidators, sidecarVersion), so agents can watch it without reading Secrets or logs.
    # Creates a Role allowing only get/patch on that ConfigMap; the service account token is mounted only into
    # the sidecar containers. Needs `serviceAccount.enabled` and `rbac.enabled`.
    enabled: true

# -- Validator client configuration
validatorClient:
  # -- Enable the validator client container
  # If you want to use an externally managed validator client.
  # Set this to false, and set your external validator to communicate with the 'validator-api' service created by this chart as if it were a beacon node API.
  enabled: true
  # -- Type of validator client to use
  # Options: lighthouse, teku, prysm, nimbus, lodestar
  type: "lighthouse"

  # -- Image configuration for validator client
  # Repository and tag will be auto-selected based on validator client type if not specified
  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent

  # -- Validator client specific configuration
  config:
    # -- Graffiti to include in proposed blocks
    # Leaving it unset will result in charon defaults.
    graffiti: ""
    # -- Network configuration for validator client (e.g., mainnet, sepolia)
    # Used by some validator clients like Teku for network-specific configuration
    network: ""
    # -- Additional CLI arguments passed to the validator client (regardless of type)
    # (the minimum required mev flags are automatically included when you set .Values.charon.builderApi to true)
    extraArgs: []

    # -- Configuration for the prysm validator client specifically
    # Used to pass Prysm VC specific configuration
    # NOTE: By using Prysm, you automatically accept the Terms of Service: https://github.com/prysmaticlabs/prysm/blob/develop/TERMS_OF_SERVICE.md
    prysm:
      # -- Additional CLI arguments passed to the Prysm validator client only
      extraArgs: []

  # -- Resource limits and requests for validator client
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 1Gi

  # -- Validator keystores configuration
  keystores:
    # -- Name of the Secret containing validator keystores
    # If provided, skip keystore generation and use existing keys
    # The secret should contain keystore-*.json and keystore-*.txt files
    # Example: kubectl create secret generic validator-keys --from-file=keystore-0.json --from-file=keystore-0.txt
    # secretName: "validator-keys"
    secretName: ""

# -- Central Monitoring
centralMonitoring:
  # -- Specifies whether central monitoring should be enabled
  enabled: false
  # -- https endpoint to obol central prometheus
  promEndpoint: "https://vm.monitoring.gcp.obol.tech/write"
  # -- The authentication token to the central prometheus
  token: ""

# -- Charon image repository, pull policy, and tag version
image:
  repository: obolnetwork/charon
  pullPolicy: IfNotPresent
  tag: v1.11.2

# -- Credentials to fetch images from private registry
## ref: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []

# -- Global configuration that can be referenced across the chart
# Used for test configurations and shared settings
global:
  # -- Global annotations applied to resources
  annotations: {}

# -- Provide a name in place of charon for `app:` labels
nameOverride: ""

# -- Provide a name to substitute for the full names of resources
fullnameOverride: ""

# -- Pod annotations
podAnnotations:
  # Pod Security Standards annotations
  # These annotations enforce security policies at the pod level
  # https://kubernetes.io/docs/concepts/security/pod-security-standards/
  # Note: We use "baseline" instead of "restricted" because the prepare-validator-data
  # init container needs to run as root to set proper file ownership
  pod-security.kubernetes.io/enforce: "baseline"
  pod-security.kubernetes.io/enforce-version: "latest"
  pod-security.kubernetes.io/audit: "baseline"
  pod-security.kubernetes.io/audit-version: "latest"
  pod-security.kubernetes.io/warn: "baseline"
  pod-security.kubernetes.io/warn-version: "latest"

# -- Service account
## ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/
serviceAccount:
  # -- Specifies whether a service account should be created
  enabled: true
  # -- Annotations to add to the service account
  annotations: {}
  # -- The name of the service account to use. If not set, a name is generated using the default template
  name: ""
  # -- The name of the service account to use for test pods. If not set, uses the main service account
  nameTest: ""

# -- The security context for pods
# @default -- See `values.yaml`
# fsGroup lets the non-root containers (uid 1000) write to volumes provisioned root-owned.
# Note: do not set runAsNonRoot here; the prepare-validator-data init container runs as root
# to set file permissions.
securityContext:
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch

# -- The security context for containers
# @default -- See `values.yaml`
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false  # Charon needs to write to data directory
  capabilities:
    drop:
    - ALL

# -- RBAC configuration.
## ref: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
rbac:
  # -- Specifies whether RBAC resources are to be created
  enabled: true
  # -- The name of the cluster role to use. If not set and create is true, a name is generated using the fullname template
  name: ""
  # -- ClusterRole rules for the pod's service account. None of the chart's containers call the
  # Kubernetes API, so this is empty by default; the ClusterRole is only created when rules are set.
  clusterRules: []
  # -- Role rules for the pod's service account. Empty by default; the Role is only created when rules are set.
  rules: []

# -- Grant read access to this release's public ConfigMaps ("<fullname>-dkg-status" and "<fullname>-enr")
# to service accounts outside the release, e.g. an agent watching DKG progress. Renders a Role with
# get/watch restricted to those two names (no list: Kubernetes can't restrict list by name, so readers
# fetch them by name) and a RoleBinding. Never grants access to Secrets.
# Obol Stack (Hermes agent): [{namespace: hermes-obol-agent, serviceAccount: hermes}]
statusReaders: []
# - namespace: hermes-obol-agent
#   serviceAccount: hermes

# -- Optional Service exposing charon's libp2p port outside the cluster, so peers can connect directly
# instead of via relays. Disabled by default (relays work without it).
# With LoadBalancer, set `charon.p2pExternalIp` (or `p2pExternalHostname`) to the load balancer address.
# With NodePort, peers reach the node port, so charon must listen and advertise on that same port: e.g.
# `nodePorts.tcp: 31610`, `charon.p2pTcpAddress: 0.0.0.0:31610`, `service.ports.p2pTcp.targetPort: 31610`,
# and `charon.p2pExternalIp: <node public IP>`. UDP (QUIC) is added when `charon.p2pUdpAddress` is set.
p2pService:
  enabled: false
  # -- NodePort or LoadBalancer
  type: LoadBalancer
  # -- Service annotations (e.g. cloud load balancer settings)
  annotations: {}
  # -- Service port for libp2p TCP (and UDP)
  port: 3610
  # -- Fixed node ports when type is NodePort (null: allocated by Kubernetes)
  nodePorts:
    tcp: null
    udp: null
  # -- Cluster or Local. Local preserves the peer's source IP and avoids a second hop.
  externalTrafficPolicy: Local
  # -- loadBalancerIP for providers that support it
  loadBalancerIP: ""
  # -- Restrict which source ranges may reach a LoadBalancer
  loadBalancerSourceRanges: []

# -- Charon service ports
service:
  # -- Headless service to create DNS for each statefulset instance
  clusterIP: None
  # -- Publish DNS records for pods that are not Ready yet. Peers resolve each other's
  # <pod>.<fullname>.<namespace>.svc names during the DKG and before charon is ready.
  publishNotReadyAddresses: true
  ports:
    validatorApi:
      name: validator-api
      port: 3600
      protocol: TCP
      targetPort: 3600
    p2pTcp:
      name: p2p-tcp
      port: 3610
      protocol: TCP
      targetPort: 3610
    monitoring:
      name: monitoring
      port: 3620
      protocol: TCP
      targetPort: 3620

# -- Pod resources limits and requests
resources:
  # Default resource limits and requests for the main Charon container
  # These values are suitable for production use and can be adjusted based on your needs
  limits:
    cpu: 2000m
    memory: 4Gi
  requests:
    cpu: 1000m
    memory: 2Gi

# -- Node labels for pod assignment
## ref: https://kubernetes.io/docs/user-guide/node-selection/
nodeSelector: {}

# -- Tolerations for pod assignment
## ref: https://kubernetes.io/docs/concepts/configuration/taint-and-toleration/
tolerations: {}

# -- Affinity for pod assignment
## ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#affinity-and-anti-affinity
##
## Example:
## affinity:
##   podAntiAffinity:
##     requiredDuringSchedulingIgnoredDuringExecution:
##     - labelSelector:
##         matchExpressions:
##         - key: app.kubernetes.io/name
##           operator: In
##           values:
##           - charon
##       topologyKey: kubernetes.io/hostname
##
affinity: {}

# -- Used to assign priority to pods
## ref: https://kubernetes.io/docs/concepts/configuration/pod-priority-preemption/
priorityClassName: ""

# -- Enable pod disruption budget
## ref: https://kubernetes.io/docs/tasks/run-application/configure-pdb
podDisruptionBudget:
  minAvailable: ""
  enabled: true

# -- Maximum number of pods that can be unavailable for cluster threshold
# Used in pod disruption budget when minAvailable is not specified
clusterThreshold: ""

# -- allows you to configure and disable automated rolling updates for containers, labels, resource request/limits, and annotations for the Pods in a StatefulSet.
updateStrategy: RollingUpdate

# -- Persistence configuration for DKG artifacts and charon data
persistence:
  # -- Enable persistence using a PersistentVolumeClaim.
  enabled: true
  # -- Storage class for the PVC. If undefined or null, the default storage class will be used.
  # storageClassName: "" # e.g., "standard", "gp2"
  # -- Access modes for the PVC. Must be a list. Default: ["ReadWriteOnce"].
  accessModes:
    - ReadWriteOnce
  # -- Size of the PVC for charon-data.
  size: 1Gi
  # -- Size of the PVC for validator-data.
  # Validator data includes slashing protection DB and other validator state.
  # NOTE: Validator data ALWAYS uses persistent storage to prevent slashing,
  # even if persistence.enabled is false for charon-data.
  validatorDataSize: 500Mi
  # -- Annotations for the PVC
  # Example: annotations: {"volume.beta.kubernetes.io/storage-class": "fast"}
  annotations: {}
  # -- StatefulSet persistentVolumeClaimRetentionPolicy. Retain keeps charon-data (cluster-lock, key shares)
  # and validator-data (slashing protection) when the StatefulSet is deleted or scaled down
  # (Kubernetes >= 1.27). Set to null to omit the field.
  retentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain


# -- Prometheus Service Monitor
## ref: https://github.com/coreos/prometheus-operator
serviceMonitor:
  # -- If true, a ServiceMonitor CRD is created for a prometheus operator. https://github.com/coreos/prometheus-operator
  # TODO: SWITCH BACK TO ON FOR PRODUCTION
  enabled: false
  # -- Path to scrape
  path: /metrics
  # -- Alternative namespace for ServiceMonitor
  namespace: ""
  # -- Additional ServiceMonitor labels
  labels: {}
  # -- Additional ServiceMonitor annotations
  annotations: {}
  # -- ServiceMonitor scrape interval
  interval: 1m
  # -- ServiceMonitor scheme
  scheme: http
  # -- ServiceMonitor TLS configuration
  tlsConfig: {}
  # -- ServiceMonitor scrape timeout
  scrapeTimeout: 30s
  # -- ServiceMonitor relabelings
  relabelings: []

# -- Configure liveness probes
## ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:
  enabled: false
  initialDelaySeconds: 10
  periodSeconds: 5
  httpGet:
    path: /livez
    # -- Port for liveness probe HTTP checks
    port: 3620

# -- Readiness probe on charon's /readyz (beacon node synced, peers and validator client connected).
# Readiness only marks the pod Ready; Services publish not-ready addresses, so peers and an external VC can
# still connect while charon gets ready. There is deliberately no liveness probe by default: a node that is
# up but waiting for peers or a syncing beacon node must not be restarted. Init containers (DKG) run first.
## ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
readinessProbe:
  enabled: true
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  httpGet:
    path: /readyz
    # -- Port for readiness probe HTTP checks
    port: 3620

# -- Configuration for running Helm tests.
# These values are typically only used when `helm test` is run.
tests:
  # -- The operator address to use for DKG sidecar tests.
  # This should be a valid Ethereum address (0x...).
  dkgSidecar:
    enabled: true
    operatorAddress: "0x3D1f0598943239806A251899016EAf4920d4726d"
    # -- Target config hash for testing (optional)
    # When set, enables test-target-config-hash-set.yaml test and passes hash to DKG sidecar tests
    targetConfigHash: "0x7f0fd29abb11674b4e61000de26bff3600237aab0402427bd1409756665c2115"
    mockApi:
      port: 3001
      image:
        pullPolicy: Always # Or Always, Never as needed
    # -- Service account settings for test pods
    serviceAccount:
      create: true # Whether to specify the test service account for test pods
    # -- Host network setting for dkgSidecar test pods
    hostNetwork: false

  # -- Validator keystore configuration test
  validatorKeystore:
    # -- Enable validator keystore configuration tests
    enabled: false
    # -- Validator client type to test (lodestar, lighthouse, teku, prysm, nimbus)
    # Currently lodestar, prysm, and nimbus are implemented
    validatorClientType: "lodestar"
    # -- Number of mock keystores to generate for testing
    mockKeystoreCount: 2

# -- Configuration for the DKG Mock API Server used in tests.
# This is relevant if you are using the mock server deployment included in this chart for testing.

# -- NetworkPolicy configuration for pod network isolation
networkPolicy:
  # -- Enable NetworkPolicy to restrict network traffic
  enabled: false
  # -- Selector for validator client pods that can access the validator API
  validatorClientSelector: {}
    # app: validator-client
  # -- Namespace selector for validator client access
  validatorClientNamespaceSelector: {}
    # name: validators
  # -- Monitoring configuration
  monitoring:
    # -- Enable access from monitoring tools
    enabled: true
    # -- Pod selector for monitoring tools (e.g., Prometheus)
    podSelector: {}
      # app: prometheus
    # -- Namespace selector for monitoring namespace
    namespaceSelector: {}
      # name: monitoring
    # -- Additional NetworkPolicyPeers allowed to reach port 3620 (metrics, /readyz), e.g. an agent namespace.
    # Only applied when podSelector or namespaceSelector is set (otherwise 3620 is open to all sources).
    # Obol Stack Hermes: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: hermes-obol-agent}}}]
    extraFrom: []
  # -- Beacon node configuration
  beaconNodes:
    # -- Enable egress to beacon nodes
    enabled: true
    # -- Pod selector for beacon nodes
    podSelector: {}
    # -- Namespace selector for beacon nodes
    namespaceSelector: {}
    # -- IP block for external beacon nodes
    ipBlock: {}
      # cidr: 0.0.0.0/0
      # except:
      #   - 169.254.169.254/32
    # -- Port for beacon node connections (leave empty for any port)
    port: ""
  # -- Obol API configuration
  obolApi:
    # -- Enable egress to Obol API for DKG
    enabled: true
    # -- CIDR block for Obol API access
    cidr: "0.0.0.0/0"
    # -- IP ranges to exclude
    except: []
  # -- Charon P2P traffic outside the cluster (peers and relays)
  p2p:
    # -- Allow egress to peers/relays on `ports` (TCP and UDP)
    enabled: true
    # -- Also allow inbound peers from `cidr` (always on when p2pService is enabled)
    allowInbound: false
    # -- CIDR for external peers and relays
    cidr: "0.0.0.0/0"
    # -- IP ranges to exclude
    except: []
    # -- Peer/relay libp2p ports
    ports:
      - 3610
  # -- Kubernetes API egress for the DKG sidecar's status ConfigMap (only rendered when dkg.status is active)
  kubeApi:
    enabled: true
    # -- CIDR of the API server endpoints
    cidr: "0.0.0.0/0"
    # -- API server ports (443 for the kubernetes Service, 6443 for typical endpoints)
    ports:
      - 443
      - 6443
  # -- Custom ingress rules to add
  customIngress: []
  # -- Custom egress rules to add
  customEgress: []
