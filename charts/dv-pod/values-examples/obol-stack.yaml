# dv-pod in the Obol Stack (k3d, single node).
#
# The Stack runs its own Ethereum node (`obol network install ethereum`), a Prometheus that selects
# ServiceMonitors labelled `release: monitoring`, and the Hermes agent in namespace hermes-obol-agent.
# Replace <id> with your ethereum deployment id:  obol kubectl get svc -A | grep ethereum-beacon
#
# Launchpad route (default here):
#   obol helm upgrade --install my-dv-pod obol/dv-pod -n dv-pod --create-namespace \
#     -f obol-stack.yaml --set charon.operatorAddress=0xYOUR_OPERATOR_ADDRESS
# Direct route (cluster definition from `charon create dkg --publish`):
#   ... -f obol-stack.yaml --set mode=definition --set dkg.definition.configHash=0xCONFIG_HASH
#
# Then read the ENR / status without Secrets:
#   obol kubectl get cm my-dv-pod-enr -n dv-pod -o jsonpath='{.data.enr}'
#   obol kubectl get cm my-dv-pod-dkg-status -n dv-pod -o jsonpath='{.data.phase}'

network: hoodi

mode: launchpad

charon:
  operatorAddress: "" # set with --set charon.operatorAddress=0x...
  beaconNodeEndpoints:
    - "http://ethereum-beacon.ethereum-<id>.svc.cluster.local:5052"
  # Fall back to publicnode.com for `network` while the local beacon node syncs.
  publicnodeFallback: true
  # Only enable when the Stack's beacon node is connected to MEV-boost / a relay.
  # With no MEV sidecar in the Stack, keep it off or proposals fail over to local blocks with warnings.
  builderApi: false
  nickname: "obol-stack"

# Let the Hermes agent read this release's DKG status and ENR ConfigMaps (get/watch by name only).
# Its service account is `hermes` (not `hermes-obol-agent`).
statusReaders:
  - namespace: hermes-obol-agent
    serviceAccount: hermes

serviceMonitor:
  enabled: true
  labels:
    release: monitoring

# If you enable networkPolicy, keep Prometheus and Hermes able to scrape 3620:
# networkPolicy:
#   enabled: true
#   monitoring:
#     namespaceSelector:
#       matchLabels:
#         kubernetes.io/metadata.name: monitoring
#     extraFrom:
#       - namespaceSelector:
#           matchLabels:
#             kubernetes.io/metadata.name: hermes-obol-agent
